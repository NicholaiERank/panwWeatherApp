name: weatherAppFetcher

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  check-weather:
    runs-on: self-hosted
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup and Run
        env:
          # Updated to match the secretsmgr subdomain
          CONJUR_URL: "https://nranktest.secretsmgr.cyberark.cloud/api"
          CONJUR_AUTHN_ID: "githubWeatherAuthenticator"
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install requests
          python3 weather.py
